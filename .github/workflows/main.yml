name: Unzip

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Node.js 24 force run karne ke liye environment variable
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout with deep fetch to prevent Git 128 error
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Check if file exists (Handling case-sensitivity and spaces)
      - name: Check Zip File Existence
        run: |
          ls -la # Debugging ke liye directory contents print karega
          if [ ! -f "Source code.zip" ]; then
            echo "::error::'Source code.zip' file repository me nahi mili!"
            exit 1
          fi

      # 3. Safe Unzip execution
      - name: Extract Source Code
        run: |
          mkdir -p extracted_source
          unzip -o "Source code.zip" -d extracted_source
          echo "Zip file successfully extracted to 'extracted_source/' directory."

      # 4. Verification
      - name: Verify Extracted Contents
        run: |
          echo "=== Extracted Directory Structure ==="
          ls -R extracted_source
